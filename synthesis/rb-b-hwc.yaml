---
# NPU 내부 합산 안 B — **합성기 수용 검사용** (tools/npu_readback_synth_check.py 가 만들었다, 2026-10-21).
#   설계: docs/results/npu-readback-design.md 1절. 층 A = ②′ p1 (Conv1d 64→64 k=8) + Abs, 8비트 (출력 시프트 4.0).
#   층 A 를 시프트 s+4 / s / s−4 로 3벌 (in_sequences: -1 로 같은 입력), 각각 A-sum 의 층 B.
#   입력 (64, 64) int8 — ②′ 와 같은 판단 1회 청크. 보드용이 아니다 (p2 와의 가중치 배치 --weight-start 없음).
arch: ai85safesoundrb_b
dataset: SafeSoundFEP1

layers:
  # 층 A1: Gabor conv + Abs → 8비트 (시프트는 체크포인트 output_shift)
  - pad: 0
    activate: Abs
    in_offset: 0x0000
    out_offset: 0x2000
    processors: 0xffffffffffffffff
    data_format: HWC
    operation: Conv1d
    kernel_size: 8
  # 층 B1: cos+sin 같은 대역 8탭 합 (k=8, 가중치 0.5) → wide int32, 프레임 위치만 CPU 가 읽는다
  - pad: 0
    activate: None
    in_offset: 0x2000
    out_offset: 0x4000
    processors: 0xffffffffffffffff
    operation: Conv1d
    kernel_size: 8
    output_width: 32
    output_processors: 0x00000000ffffffff
    output: true
  # 층 A2: Gabor conv + Abs → 8비트 (시프트는 체크포인트 output_shift)
  - pad: 0
    activate: Abs
    in_offset: 0x0000
    in_sequences: -1
    out_offset: 0x2400
    processors: 0xffffffffffffffff
    data_format: HWC
    operation: Conv1d
    kernel_size: 8
  # 층 B2: cos+sin 같은 대역 8탭 합 (k=8, 가중치 0.5) → wide int32, 프레임 위치만 CPU 가 읽는다
  - pad: 0
    activate: None
    in_offset: 0x2400
    out_offset: 0x4400
    processors: 0xffffffffffffffff
    operation: Conv1d
    kernel_size: 8
    output_width: 32
    output_processors: 0x00000000ffffffff
    output: true
  # 층 A3: Gabor conv + Abs → 8비트 (시프트는 체크포인트 output_shift)
  - pad: 0
    activate: Abs
    in_offset: 0x0000
    in_sequences: -1
    out_offset: 0x2800
    processors: 0xffffffffffffffff
    data_format: HWC
    operation: Conv1d
    kernel_size: 8
  # 층 B3: cos+sin 같은 대역 8탭 합 (k=8, 가중치 0.5) → wide int32, 프레임 위치만 CPU 가 읽는다
  - pad: 0
    activate: None
    in_offset: 0x2800
    out_offset: 0x4800
    processors: 0xffffffffffffffff
    operation: Conv1d
    kernel_size: 8
    output_width: 32
    output_processors: 0x00000000ffffffff
    output: true
