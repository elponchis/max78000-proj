---
# 구성 (a) — D-1 + NPU 안 로그 근사 (구간선형 오목, K=4)
#
# ④ 와 **첫 층 활성화 하나만** 다르다 (ReLU → Abs). 나머지는 전부 같다.
# Abs 를 쓰는 이유: 첫 층은 k=1 이라 128탭 FIR 100개와 같고, cos/sin 쌍으로
# 밴드를 만든다. ReLU 면 위상에 따라 두 채널이 동시에 0 이 되어 밴드가
# 사라지므로 |re|,|im| 를 그대로 얻는 Abs 가 맞다.
# MAX78000 이 Abs 를 지원하는지는 합성으로 확인한다 (izer/op.py:28 ACT_ABS).
#
# ai8x-synthesis/networks/kws20-v3-hwc.yaml 에서 파생했다. 우리 백본이
# KWS20 v3 와 **층 구성·채널 수가 동일**하고 출력 클래스 수만 21 → 5 라서
# 층 서술과 프로세서 마스크가 그대로 성립한다 (클래스 수는 yaml 에 없다).
#
# 입력: (128, 128) int8. 행 축 r = 프레임 내 잔 시간, 열 축 c = 8ms 프레임.
#       x[r][c] = sample[c*128 + r]  (CLAUDE.md 4장)
arch: ai85safesoundlogstage
dataset: SafeSound

layers:
  # ── voice_conv1 : Conv1d k=1, 128 → 100
  - pad: 0
    activate: Abs
    out_offset: 0x2000
    processors: 0xffffffffffffffff
    data_format: HWC
    operation: Conv1d
    kernel_size: 1
  # ── La (로그 근사 마디) : Conv1d k=1, 100 -> 400, ReLU, **per-channel bias**
  #    bias 가 마디 위치 -t_k 다. 400개 x 1byte = 400B (바이어스 메모리 2,048B).
  #    ⚠️ 400 출력 채널은 **60프로세서 x 7패스**로 나뉜다. 출력 맵의
  #    비트 수가 정확히 60이어야 한다 (64를 주면 합성이 거부한다).
  - pad: 0
    activate: ReLU
    out_offset: 0x0000
    processors: 0x000fffffffffffff
    output_processors: 0x0fffffffffffffff
    operation: Conv1d
    kernel_size: 1
  # ── Lb (음의 가중합) : Conv1d k=1, 400 -> 100, **활성화 없음**
  #    활성화가 붙으면 오목 합이 깨진다.
  - pad: 0
    activate: None
    out_offset: 0x2000
    processors: 0x0fffffffffffffff
    operation: Conv1d
    kernel_size: 1
  # ── voice_conv2 : Conv1d k=3, 100 → 96
  - pad: 0
    activate: ReLU
    out_offset: 0x0000
    processors: 0x000fffffffffffff
    operation: Conv1d
    kernel_size: 3
  # ── voice_conv3 : MaxPool2 + Conv1d k=3, 96 → 64
  - max_pool: 2
    pool_stride: 2
    pad: 1
    activate: ReLU
    out_offset: 0x2000
    processors: 0x0000ffffffffffff
    operation: Conv1d
    kernel_size: 3
  # ── voice_conv4 : Conv1d k=3, 64 → 48
  - pad: 0
    activate: ReLU
    out_offset: 0x0000
    processors: 0xffffffffffffffff
    operation: Conv1d
    kernel_size: 3
  # ── kws_conv1 : MaxPool2 + Conv1d k=3, 48 → 64
  - max_pool: 2
    pool_stride: 2
    pad: 1
    activate: ReLU
    out_offset: 0x2000
    processors: 0x0000ffffffffffff
    operation: Conv1d
    kernel_size: 3
  # ── kws_conv2 : Conv1d k=3, 64 → 96
  - pad: 0
    activate: ReLU
    out_offset: 0x0000
    processors: 0xffffffffffffffff
    operation: Conv1d
    kernel_size: 3
  # ── kws_conv3 : AvgPool2 + Conv1d k=3, 96 → 100
  - avg_pool: 2
    pool_stride: 2
    pad: 1
    activate: ReLU
    out_offset: 0x2000
    processors: 0x0000ffffffffffff
    operation: Conv1d
    kernel_size: 3
  # ── kws_conv4 : MaxPool2 + Conv1d k=6, 100 → 64
  - max_pool: 2
    pool_stride: 2
    pad: 1
    activate: ReLU
    out_offset: 0x0000
    processors: 0x000fffffffffffff
    operation: Conv1d
    kernel_size: 6
  # ── fc : 4×64 = 256 → 5 (wide, 32bit 출력. Softmax 는 CPU)
  - flatten: true
    out_offset: 0x2000
    processors: 0xffffffffffffffff
    operation: MLP
    output_width: 32
    activate: None
