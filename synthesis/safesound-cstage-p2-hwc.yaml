---
# 구성 (c) 2패스 — CPU 로그를 거친 100채널 int8 을 받는 분류기.
#
# D-1 의 voice_conv2 이하를 **그대로** 떼어 온 것이다. 층 서술·프로세서
# 마스크·오프셋을 하나도 바꾸지 않았다 — 바꾸면 (c) 와 D-1 의 차이가
# 로그단 하나가 아니게 된다.
#
# ⚠️ 핑퐁 오프셋을 **D-1 과 반대로** 뒤집었다. D-1 에서는 voice_conv1 이
# 0x2000 에 쓰고 voice_conv2 가 0x0000 에 썼는데, 여기서는 voice_conv2 가
# **입력층**이라 입력(0x0000)을 제 출력으로 덮어쓰게 된다:
#   ERROR: Layer 0 output ... is overwriting input at offset 0x00400000
# 그래서 전 층의 out_offset 을 0x0000 ↔ 0x2000 으로 교환했다.
# 층의 **순서·연산·마스크는 그대로**이고 버퍼 두 개를 번갈아 쓰는 순서만
# 바뀌므로 자원 사용량과 결과는 영향받지 않는다.
#
# 입력 오프셋: 1패스의 출력(0x2000, int32)을 CPU 가 읽어 **0x0000 에**
# int8 로 써 넣는 것을 전제한다.
#
# 입력: (100, 128) int8 — CPU 가 log2 + 양자화한 값
arch: ai85safesoundcstage_p2
dataset: SafeSoundLog

layers:
  # ── voice_conv2 : Conv1d k=3, 100 → 96
  - pad: 0
    activate: ReLU
    out_offset: 0x2000
    processors: 0x000fffffffffffff
    data_format: HWC
    operation: Conv1d
    kernel_size: 3
  # ── voice_conv3 : MaxPool2 + Conv1d k=3, 96 → 64
  - max_pool: 2
    pool_stride: 2
    pad: 1
    activate: ReLU
    out_offset: 0x0000
    processors: 0x0000ffffffffffff
    operation: Conv1d
    kernel_size: 3
  # ── voice_conv4 : Conv1d k=3, 64 → 48
  - pad: 0
    activate: ReLU
    out_offset: 0x2000
    processors: 0xffffffffffffffff
    operation: Conv1d
    kernel_size: 3
  # ── kws_conv1 : MaxPool2 + Conv1d k=3, 48 → 64
  - max_pool: 2
    pool_stride: 2
    pad: 1
    activate: ReLU
    out_offset: 0x0000
    processors: 0x0000ffffffffffff
    operation: Conv1d
    kernel_size: 3
  # ── kws_conv2 : Conv1d k=3, 64 → 96
  - pad: 0
    activate: ReLU
    out_offset: 0x2000
    processors: 0xffffffffffffffff
    operation: Conv1d
    kernel_size: 3
  # ── kws_conv3 : AvgPool2 + Conv1d k=3, 96 → 100
  - avg_pool: 2
    pool_stride: 2
    pad: 1
    activate: ReLU
    out_offset: 0x0000
    processors: 0x0000ffffffffffff
    operation: Conv1d
    kernel_size: 3
  # ── kws_conv4 : MaxPool2 + Conv1d k=6, 100 → 64
  - max_pool: 2
    pool_stride: 2
    pad: 1
    activate: ReLU
    out_offset: 0x2000
    processors: 0x000fffffffffffff
    operation: Conv1d
    kernel_size: 6
  # ── fc : 4×64 = 256 → 5 (wide, 32bit 출력. Softmax 는 CPU)
  - flatten: true
    out_offset: 0x0000
    processors: 0xffffffffffffffff
    operation: MLP
    output_width: 32
    activate: None
